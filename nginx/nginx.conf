user  nginx;
worker_processes  auto;

# Diagnostics never contain raw URL, headers, or request-body data.
error_log  /dev/null emerg;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Keep useful bounded diagnostics without recording paths or query strings.
    log_format safe '$request_method $status $request_time "$upstream_http_x_correlation_id"';
    access_log /var/log/nginx/access.log safe;

    sendfile on;
    keepalive_timeout 65;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # The console is a handful of static files per visit; its own zone keeps
    # asset loads from consuming the API budget of the same address.
    limit_req_zone $binary_remote_addr zone=console_limit:10m rate=20r/s;
    limit_req_status 429;

    server_tokens off;

    gzip on;
    gzip_types application/json text/css text/javascript application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    ssl_protocols TLSv1.3;
    # ssl_ciphers controls TLS 1.2 and below; TLS 1.3 suites use OpenSSL's Ciphersuites setting.
    ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # The API sets the Content-Security-Policy that fits what it returns (the
    # strict console policy for the console, "nothing may load" for JSON).
    # nginx only supplies a strict fallback for responses it generates itself
    # (429, 502, 504), so the header is always present exactly once.
    map $upstream_http_content_security_policy $simpastil_csp {
        default $upstream_http_content_security_policy;
        ""      "default-src 'none'; frame-ancestors 'none'";
    }

    # $public_https_port comes from NGINX_PUBLIC_HTTPS_PORT through the image's
    # template step (templates/public-port.conf.template).
    include /etc/nginx/conf.d/public-port.conf;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Container healthcheck only; answered before the HTTPS redirect.
        location = /healthz {
            access_log off;
            return 204;
        }

        location / {
            return 301 https://$host:$public_https_port$request_uri;
        }
    }

    server {
        listen 34857 ssl;
        listen [::]:34857 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # HSTS belongs to the TLS terminator; the API never sends it.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy $simpastil_csp always;

        # The API sets these itself; hide its copies so each header appears once
        # and the values above are the ones clients see.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Content-Security-Policy;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: client-supplied X-Forwarded-For is untrusted.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Recovery tokens are never in these paths or queries: browser hash
        # fragments are not sent to the server.
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api:8080;
        }

        # The account export streams a whole account as one file and can take
        # longer than a normal call. Nothing is buffered, so memory stays flat.
        location = /api/v1/account/export {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api:8080;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # The API serves the admin console (hash routes, so every console URL
        # is "/" or a hashed asset); there is no second copy to keep in sync.
        location / {
            limit_req zone=console_limit burst=40 nodelay;
            proxy_pass http://api:8080;
        }
    }
}
