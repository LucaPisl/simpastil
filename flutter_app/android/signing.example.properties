# Copy to signing.properties (gitignored) or supply the equivalent protected
# environment variables in the release job. Never use production values here.
SIMPASTIL_KEYSTORE_PATH=/absolute/path/to/release-signing.p12
SIMPASTIL_KEY_ALIAS=replace-with-release-key-alias
SIMPASTIL_STORE_PASSWORD=load-from-secret-manager
SIMPASTIL_KEY_PASSWORD=load-from-secret-manager
SIMPASTIL_EXPECTED_CERT_SHA256=replace-with-64-character-sha256-fingerprint
