name: simpastil
description: Offline-first medication tracker with optional self-hosted sync.
publish_to: 'none'
version: 1.1.1+5

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State management ─────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1

  # ── Local database (Drift / SQLite) ──────────────────────────────────────
  # drift_dev 2.34.1+ needs analyzer 13 (meta >=1.18), which Flutter 3.41.5 pins
  # at 1.17, and drift must match drift_dev. sqlite3 3.6+ needs hooks 2.2
  # (record_use, meta >=1.19): both wait for a newer Flutter SDK.
  drift: 2.34.0
  sqlite3: 3.5.2
  simpastil_storage:
    path: packages/simpastil_storage

  # ── Networking ───────────────────────────────────────────────────────────
  dio: ^5.11.1

  # ── Secure credential storage (Android Keystore / iOS Secure Enclave) ────
  flutter_secure_storage: ^9.2.2

  # ── Local notifications (exact alarms, Android 13+) ──────────────────────
  flutter_local_notifications: ^22.3.2

  # ── Navigation ───────────────────────────────────────────────────────────
  # go_router 18 requires Dart 3.12.
  go_router: ^17.5.0

  # ── Utilities ────────────────────────────────────────────────────────────
  crypto: ^3.0.7
  cryptography: 2.9.0
  intl: ^0.20.2
  uuid: ^4.6.0
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.5.6
  connectivity_plus: ^7.3.2
  local_auth: ^3.0.2

  # ── Background tasks ──────────────────────────────────────────────────────
  workmanager: ^0.10.10

  # ── Home-screen widget (Android) ──────────────────────────────────────────
  home_widget: ^0.10.0

  timezone: 0.11.2
  collection: ^1.19.1
  # package_info_plus 10, device_info_plus 13 and share_plus 13 need win32 ^6,
  # while flutter_secure_storage 9 needs win32 ^5; lift them with that upgrade.
  package_info_plus: ^9.0.1
  # permission_handler 13 compiles against API 37 (AGP 8.11 and Flutter 3.41.5
  # target 36) and Permission.status never reports permanentlyDenied there.
  permission_handler: ^12.0.1
  device_info_plus: ^12.4.0
  # 1.9.0+ builds only with AGP 9 (its Gradle script uses the built-in Kotlin DSL).
  dynamic_color: 1.8.1

  # ── Data export (Split 7) ─────────────────────────────────────────────────
  pdf: ^3.12.0 # 3.13 requires Dart 3.12
  csv: ^8.0.0
  share_plus: ^12.0.0 # 13 needs win32 ^6, see package_info_plus
  flutter_timezone: ^5.1.1
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.0
  fake_async: ^1.3.0
  flutter_launcher_icons: ^0.14.3

  # Code generators — run: dart run build_runner build --delete-conflicting-outputs
  # build_runner 2.15.3+ needs analyzer 13 (see drift above).
  build_runner: ^2.15.1
  drift_dev: 2.34.0
flutter:
  generate: true
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      # Compiled from the vendored SQLite3 Multiple Ciphers amalgamation, see
      # third_party/sqlite3mc/README.md. Resolved relative to this pubspec.
      source: source
      path: ../third_party/sqlite3mc/sqlite3mc_amalgamation.c

flutter_launcher_icons:
    android: true
    ios: false
    image_path: "assets/icon/app_icon.png"
    # Optional: adaptive icon (Android 8+)
    # adaptive_icon_background: "#FFFFFF"   # or a hex color / path to bg image
    # adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
