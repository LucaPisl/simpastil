name: simpastil
description: Offline-first medication tracker with optional self-hosted sync.
publish_to: 'none'
version: 1.1.1+5

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State management ─────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1

  # ── Local database (Drift / SQLite) ──────────────────────────────────────
  drift: 2.34.0
  sqlite3: 3.5.2
  simpastil_storage:
    path: packages/simpastil_storage

  # ── Networking ───────────────────────────────────────────────────────────
  dio: ^5.7.0

  # ── Secure credential storage (Android Keystore / iOS Secure Enclave) ────
  flutter_secure_storage: ^9.2.2

  # ── Local notifications (exact alarms, Android 13+) ──────────────────────
  flutter_local_notifications: ^17.2.4

  # ── Navigation ───────────────────────────────────────────────────────────
  go_router: ^14.6.3

  # ── Utilities ────────────────────────────────────────────────────────────
  crypto: ^3.0.7
  cryptography: 2.9.0
  intl: ^0.20.2
  uuid: ^4.5.1
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.0
  connectivity_plus: ^6.0.0
  local_auth: ^2.3.0

  # ── Background tasks ──────────────────────────────────────────────────────
  workmanager: ^0.6.0

  # ── Home-screen widget (Android) ──────────────────────────────────────────
  home_widget: ^0.7.0

  timezone: 0.9.4
  collection: ^1.19.1
  package_info_plus: ^8.1.0
  permission_handler: ^11.3.1
  device_info_plus: ^12.4.0
  dynamic_color: ^1.7.0

  # ── Data export (Split 7) ─────────────────────────────────────────────────
  pdf: ^3.11.1
  csv: ^6.0.0
  share_plus: ^10.1.4
  flutter_timezone: ^5.1.0
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.0
  fake_async: ^1.3.0
  flutter_launcher_icons: ^0.14.3

  # Code generators — run: dart run build_runner build --delete-conflicting-outputs
  build_runner: ^2.4.13
  drift_dev: 2.34.0
flutter:
  generate: true
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      # Compiled from the vendored SQLite3 Multiple Ciphers amalgamation, see
      # third_party/sqlite3mc/README.md. Resolved relative to this pubspec.
      source: source
      path: ../third_party/sqlite3mc/sqlite3mc_amalgamation.c

flutter_launcher_icons:
    android: true
    ios: false
    image_path: "assets/icon/app_icon.png"
    # Optional: adaptive icon (Android 8+)
    # adaptive_icon_background: "#FFFFFF"   # or a hex color / path to bg image
    # adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
