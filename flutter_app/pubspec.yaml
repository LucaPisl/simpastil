name: simpastil
description: Offline-first medication tracker with optional self-hosted sync.
publish_to: 'none'
version: 1.1.1+5

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State management ─────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1

  # ── Local database (Drift / SQLite) ──────────────────────────────────────
  # drift must match drift_dev, and sqlite3 is pinned exactly because the
  # vendored SQLite3 Multiple Ciphers source in third_party/sqlite3mc has to be
  # the version that sqlite3 release expects (see its README).
  drift: 2.35.1
  sqlite3: 3.7.1
  simpastil_storage:
    path: packages/simpastil_storage

  # ── Networking ───────────────────────────────────────────────────────────
  dio: ^5.11.1

  # ── Secure credential storage (Android Keystore / iOS Secure Enclave) ────
  # Stay on 10.x until every supported install has run it once: 10 moves values
  # written by 9 out of EncryptedSharedPreferences, 11 cannot read them and
  # would lose the database key. See lib/core/storage/secure_storage_options.dart.
  flutter_secure_storage: ^10.3.4

  # ── Local notifications (exact alarms, Android 13+) ──────────────────────
  flutter_local_notifications: ^22.3.2

  # ── Navigation ───────────────────────────────────────────────────────────
  go_router: ^18.1.0

  # ── Utilities ────────────────────────────────────────────────────────────
  crypto: ^3.0.7
  cryptography: 2.9.0
  intl: ^0.20.2
  uuid: ^4.6.0
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.5.6
  connectivity_plus: ^7.3.2
  local_auth: ^3.0.2

  # ── Background tasks ──────────────────────────────────────────────────────
  workmanager: ^0.10.10

  # ── Home-screen widget (Android) ──────────────────────────────────────────
  home_widget: ^0.10.0

  timezone: 0.11.2
  collection: ^1.19.1
  package_info_plus: ^10.2.2
  # permission_handler 13 compiles against API 37 (the app pins compileSdk 37,
  # Flutter's default is 36). On Android only Permission.request() can resolve
  # to permanentlyDenied; Permission.status no longer does.
  permission_handler: ^13.0.2
  device_info_plus: ^13.3.0
  # 2.x depends on material_ui, whose ColorScheme is not Flutter's, so it stays
  # on 1.9.0 until the app moves to material_ui.
  dynamic_color: 1.9.0

  # ── Data export (Split 7) ─────────────────────────────────────────────────
  pdf: ^3.13.1
  csv: ^8.0.0
  share_plus: ^13.3.1
  flutter_timezone: ^5.1.1
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.0
  fake_async: ^1.3.0
  flutter_launcher_icons: ^0.14.3

  # Code generators — run: dart run build_runner build --delete-conflicting-outputs
  # build_runner 2.17+ conflicts with drift_dev's range of build.
  build_runner: ^2.16.2
  drift_dev: 2.35.1
flutter:
  generate: true
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      # Compiled from the vendored SQLite3 Multiple Ciphers amalgamation, see
      # third_party/sqlite3mc/README.md. Resolved relative to this pubspec.
      source: source
      path: ../third_party/sqlite3mc/sqlite3mc_amalgamation.c

flutter_launcher_icons:
    android: true
    ios: false
    image_path: "assets/icon/app_icon.png"
    # Optional: adaptive icon (Android 8+)
    # adaptive_icon_background: "#FFFFFF"   # or a hex color / path to bg image
    # adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
